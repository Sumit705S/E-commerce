<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FASHION CUBE</title>
</head>
<body>
    <!-- Home Page Content -->
    <div id="home" class="page active">
        <!-- Hero Carousel -->
        <div class="hero-carousel" id="heroCarousel">
            <div class="hero-slides" id="heroSlides">
                <!-- Generated by JS -->
            </div>
            <button class="hero-arrows left" id="heroPrev"><i class="fas fa-chevron-left"></i></button>
            <button class="hero-arrows right" id="heroNext"><i class="fas fa-chevron-right"></i></button>
            <div class="hero-dots" id="heroDots"></div>
        </div>

        <!-- Categories Section -->
        <div class="section-head">
            <h3>Shop by Category</h3>
        </div>
        <div class="category-grid" id="categoryGrid">
            <!-- Generated by JS -->
        </div>

        <!-- Featured Products -->
        <div class="section-head">
            <h3>Featured Products</h3>
            <a href="#" data-page="products" class="view-all">View All <i class="fas fa-arrow-right"></i></a>
        </div>
        <div class="product-grid" id="featuredGrid">
            <!-- Generated by JS -->
        </div>

        <!-- Promotional Banner -->
        <div class="promo-banner">
            <div class="promo-content">
                <h2>Summer Sale</h2>
                <p>Get up to 50% off on selected items</p>
                <button class="btn-shop" data-page="products">Shop Now</button>
            </div>
        </div>
    </div>

    <style>
        .promo-banner {
            background: linear-gradient(135deg, #a37b6b, #8a6555);
            border-radius: 40px;
            padding: 3rem 2rem;
            margin: 2rem 0;
            text-align: center;
            color: white;
        }

        .promo-banner h2 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .promo-banner p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
        }

        .promo-banner .btn-shop {
            background: white;
            color: #1e1e1e;
            border: none;
            padding: 0.85rem 2.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .promo-banner .btn-shop:hover {
            transform: scale(1.05);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0 2.5rem;
        }

        .category-card {
            background: #f8f6f3;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .category-img {
            height: 150px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
        }

        .category-img::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
        }

        .category-name {
            position: relative;
            z-index: 1;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .category-count {
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }
    </style>
</body>
</html>
